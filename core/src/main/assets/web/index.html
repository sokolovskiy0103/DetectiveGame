<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ece4d0">
<title>Party Games</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23ece4d0'/%3E%3Ccircle cx='14' cy='14' r='7' fill='none' stroke='%238a2c22' stroke-width='3'/%3E%3Cpath d='M19 19l8 8' stroke='%238a2c22' stroke-width='3.5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="static/core/ui.css">
<link rel="stylesheet" href="static/core/shell.css">
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<div class="top">
  <div class="logo" id="logo"></div>
  <span id="hostTag" class="tag" hidden>хост</span>
  <div class="grow"></div>
  <span id="extra" class="small muted"></span>
  <button id="infoBtn" class="mini ghost info" data-pg="rules" aria-label="Правила гри" hidden>i</button>
  <span id="conn"><span class="dot"></span></span>
  <button id="menuBtn" class="icon ghost" data-pg="menu" aria-label="Меню" hidden><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
</div>
<div id="drawer" class="drawer" aria-hidden="true"><div class="drawer-panel" role="dialog" aria-modal="true" aria-label="Меню"><div id="drawerInner"></div></div></div>
<div id="rules" class="rules-overlay" hidden></div>
<main id="app"><div class="center muted" style="margin-top:40vh"><span class="spinner"></span></div></main>
<div class="sticky" id="bar" hidden><div class="inner" id="barInner"></div></div>
<script src="static/core/shell.js"></script>
</body>
</html>
