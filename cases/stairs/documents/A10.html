<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A10 — Скріншот переписки</title>
<link rel="stylesheet" href="_base.css">
<style>
  .screen-wrap { width: 390px; margin: 0 auto 24px; }
  .screen-wrap .page.screen { margin: 0 auto; }
  .page.screen { background: #fff; }
  .phone-status .sig-icons { font-weight: 400; letter-spacing: 1px; }
  .chat-head { display: flex; align-items: center; gap: 10px; font-size: 15px; }
  .chat-head .avatar { width: 30px; height: 30px; border-radius: 50%; background: #c9d4e6; flex: none; }
  .chat-input { padding: 8px 12px; border-top: 1px solid #ddd; background: #f6f6f6; font-size: 13px; color: #888; }
  .screen-caption { font-size: 10.5pt; color: #e8e8e8; text-align: center; font-family: var(--font-official); }
  .bubble.in .t, .bubble.out .t { color: #888; }
</style>
</head>
<body>

<div class="screen-wrap">
  <section class="page screen">
    <div class="phone-status">
      <span>12:02</span>
      <span class="sig-icons">LTE ▮▮▮ 78%</span>
    </div>

    <div class="chat-head">
      <div class="avatar"></div>
      <div>Андрій ❤️</div>
    </div>

    <div class="chat">
      <div class="day-sep">Понеділок, 11 листопада 2024</div>

      <div class="bubble out">
        Ти як? Не переживай через Макса
        <span class="t">21:40</span>
      </div>

      <div class="bubble in">
        Дякую. Добраніч
        <span class="t">21:52</span>
      </div>

      <div class="day-sep">Вчора</div>

      <div class="bubble in">
        Добраніч, люблю ❤️
        <span class="t">23:07</span>
      </div>
    </div>

    <div class="chat-input">Повідомлення</div>
  </section>

  <p class="screen-caption" style="margin-top:4mm;">
    Скріншот наданий гр. Гнатів В.О. 13.11.2024 під час надання пояснень.
  </p>
</div>

</body>
</html>
