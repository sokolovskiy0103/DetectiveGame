<style>

.ft { background:#fdfdfb }
.ft h1 { font: 700 12pt var(--font-sans); margin:0 0 1mm }
.ft .sub { font: 9.5pt var(--font-sans); color:#555; margin-bottom:5mm }
.ft .grid { display:grid; grid-template-columns:1fr 1fr; gap:6mm 6mm }
figure.ph { margin:0; border:1px solid #888; padding:2.5mm; background:#fff; break-inside:avoid }
figure.ph .fr { position:relative }
figure.ph img { width:100%; display:block; border:1px solid #333 }
figure.ph figcaption { font-size:11.5pt; color:#1c3f94; margin-top:2mm; line-height:1.3 }
.ov { position:absolute; display:flex; align-items:center; justify-content:center; text-align:center; font: 700 clamp(7px,1.4vw,11px)/1.15 var(--font-sans); color:#e9d9a8; letter-spacing:1px; text-shadow:0 0 2px #000; }
.last { grid-column: 1 / span 2; width:50%; justify-self:center }
@media (max-width:820px){ .ft .grid{ grid-template-columns:1fr } .last{ grid-column:auto; width:100% } figure.ph figcaption{font-size:16px} .ov{ font-size: 8px } }

</style>
</head>
